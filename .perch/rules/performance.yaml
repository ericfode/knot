# Advisory complexity review. Calibrate with scripts/calibrate-performance-rules.mjs.
- name: perf-growing-prefix-copy
  where: "**/*.bend"
  each: method
  min: 70
  gate: false
  ensure: >
    Judge the parsed target declaration, using supplied helpers to establish its
    behavior. Do not flag an unrelated declaration merely present in context.
    Inspect loops or recursion that build a list or string. A growing accumulated
    prefix is not traversed or copied on every iteration by append, concatenate,
    or an equivalent visible helper. Such repeated prefix copying makes linear
    output construction quadratic. Prepending then reversing once, one final
    flatten, constant-time tree joins, and copying each disjoint chunk once are
    allowed. In Bend Base, List.append and String.append traverse their first
    argument. Appending a fixed-size first argument is allowed. Require a visible
    growing first argument and repetition; do not infer costs of unknown helpers
    or flag an isolated append. If absent, this rule holds.

- name: perf-loop-invariant-work
  where: "**/*.bend"
  each: method
  min: 60
  gate: false
  ensure: >
    Judge the parsed target declaration, using supplied helpers to establish its
    behavior. Do not flag an unrelated declaration merely present in context.
    Inspect repeated pure whole-input summaries inside a traversal. An unchanged
    list or tree is not fully walked to compute the same length, sum, hash, or
    summary for every element of another traversal. Compute that invariant once
    and carry its result when the helper visibly visits the whole input. A
    changing suffix, a constant-time metadata lookup, distinct disjoint inputs,
    and an explicitly fixed small bound are allowed. Require both the unchanged
    data flow and the repeated linear helper body or known Base List.length;
    do not guess costs or equate recursion itself with wasted work. If absent,
    this rule holds.

- name: perf-linked-list-indexing
  where: "**/*.bend"
  each: method
  min: 60
  gate: false
  ensure: >
    Judge the parsed target declaration, using supplied helpers to establish its
    behavior. Do not flag an unrelated declaration merely present in context.
    Inspect full sequential traversals of linked lists. Repeated List.get from
    the same head at successive increasing indices is not used to visit all
    elements: each lookup retraverses the prefix and the full walk is quadratic.
    Walk the remaining list tail directly. A single lookup, a fixed small number
    of lookups, indexing an actual random-access Array or Vec, or indexing only
    into a shrinking suffix with a fixed index is allowed. Base List.get is a
    linear linked-list lookup, not an array operation. Require visible repetition
    across a length controlled by that input. If absent, this rule holds.

- name: perf-amortized-growth
  where: "**/*.{bend,js,mjs,ts}"
  each: method
  min: 80
  gate: false
  ensure: >
    Judge the parsed target declaration, using supplied helpers to establish its
    behavior. Do not flag an unrelated declaration merely present in context.
    Inspect appendable storage that explicitly reallocates and copies its prior
    elements when capacity is exhausted. Repeated single-element appends use
    geometric growth or another visible amortized-linear strategy, rather than
    allocating exactly length+1 and copying the entire prefix on every append.
    A one-shot exact-size allocation, pre-reserving a known final size, bounded
    saturation at a documented maximum, and persistent structural sharing are
    allowed. Do not infer allocation costs for unknown library calls or reject
    checked overflow handling. Require a visible repeated copy of growing prior
    storage; if absent, this rule holds.
