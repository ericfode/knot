# Advisory pre-review coherence rules (docs/prechecks.md). Uncalibrated: `gate: false` until clean,
# broken and held-out packets separate live and adjudicated production findings exist
# (docs/perch-maintenance.md step 8). Each rule reads only its own packet directory, so one packet
# selects exactly one rule and no `npm run lint -- <src file>` picks these up:
#   .local/prechecks/packets/<increment>/<head8>/<rule-name>/<n>.md
# Packets are self-contained Markdown (Claim, Evidence, Scope) built offline by
# `npm run -s prechecks:packets`. Missing evidence is never a pass, and a stub probability is never
# calibration. The live run belongs to the coordinator, from the main checkout.
- name: claim-holds-against-evidence
  where: ".local/prechecks/packets/**/claim-holds-against-evidence/*.md"
  each: file
  min: 80
  gate: false
  ensure: >
    Inspect the Claim and Evidence sections of this packet. Every claim in the Claim
    section holds given only the Evidence section. A clause the code does not enforce,
    an exemption wider than the named cases, a normalization that hides a difference,
    an unbounded counter, an absolute word (only, exactly, every, all, never, always,
    unchanged, identical) contradicted by a changed line, or evidence missing from the
    packet breaks this rule. Missing evidence is not a pass: if the Evidence section
    does not show the code or diff needed to establish the claim, the rule is broken.
    Do not use knowledge of files the packet does not show.

- name: passages-agree
  where: ".local/prechecks/packets/**/passages-agree/*.md"
  each: file
  min: 80
  gate: false
  ensure: >
    Two passages disagree when they cannot both be true of the same case. Compare each passage in the Claim
    section with every other passage shown, in the Claim and the Evidence, on the facts they share about the
    named term: a number, count or limit; an outcome class or diagnostic; the criterion that decides a
    classification; what an operation does with each of its operands (dropped, copied, moved into the result,
    kept); and whether a change is made or only proposed, pending or awaiting a decision. The rule is broken
    when any such pair cannot both be true: one passage decides a classification by a criterion that another
    passage says does not decide it; one says every operand is dropped where another says an operand is moved
    into the result or kept; one states a change as made where another says it still awaits a decision; two give
    the same case different numbers, classes or diagnostics; or one keeps a superseded value beside the current
    one. Passages about different cases, added detail consistent with the others, and text marked as history
    hold, and a term that appears in only one passage holds. Judge only the passages shown. Missing evidence is
    not a pass where a passage's meaning depends on text the packet does not show; passages that do not overlap
    are not missing evidence.

- name: outcome-follows-d4
  where: ".local/prechecks/packets/**/outcome-follows-d4/*.md"
  each: file
  min: 80
  gate: false
  ensure: >
    This rule concerns the outcome class (Invalid, Unsupported, Exhausted, HostFailure, InternalFailure) that
    the packet's sources assign to the same case: decision rows, limit tables, outcome sentences, frozen
    expectation rows and the code that freezes them. For each case or limit that two or more sources mention,
    take the class each assigns, reading a frozen expectation by the class it records (its leading outcome
    word), not by words in its reason. The rule is broken when two sources give the same case different classes;
    when a form the implementation cannot handle yet, and that the seed accepts, is refused as Invalid or
    HostFailure instead of Unsupported; when a resource limit is refused as anything other than Exhausted with
    that limit as its cause; or when the seed succeeds and the implementation refuses and the case is none of a
    documented bound, an Unsupported capability gap, or a divergence that a decision row itself documents. A
    documented bound is a resource limit and is itself Exhausted with its cause; a refusal of any other class
    that is listed or frozen as a bound is not excused. HostFailure holds only for malformed input or a failure
    outside the program's meaning: refusing a well-formed program or its result because the implementation
    cannot handle it yet is a capability gap, even when the refusal is phrased as a host or invoke failure.
    Invalid for a program the seed also rejects holds, and so does a passage that records another component's
    observed deviation as a known defect without adopting it as this increment's outcome. Judge only the sources
    shown; a case that only one of them mentions holds, and missing evidence is not a pass for a case whose
    class the shown sources leave undecided.

- name: clause-vs-delta
  where: ".local/prechecks/packets/**/clause-vs-delta/*.md"
  each: file
  min: 80
  gate: false
  ensure: >
    The change shown alters nothing that an invariance clause in this packet says is
    unchanged, frozen, kept or forbidden, unless the clause itself lists that delta.
    Compare each clause with the governed diff hunks. A changed behavior, an added
    form, a widened profile or a moved emitter that a clause promises unchanged or
    forbids breaks this rule. A hunk the packet does not show is missing evidence, not a
    pass and not proof that nothing changed.

- name: expectation-independent
  where: ".local/prechecks/packets/**/expectation-independent/*.md"
  each: file
  min: 80
  gate: false
  ensure: >
    No expected value used to judge the implementation or its mutants is taken from
    that implementation's own output, or adopted from Knot's evaluator without
    comparison to the seed or an independent derivation. Compare the code that builds
    the want, expected or baseline values with the sentence that names their source.
    An expectation computed by the code under test, copied from its output, or labeled
    independent while derived from it breaks this rule. An expectation frozen from the
    pinned seed, or derived by a separate reference, satisfies it. Anything the packet
    does not show is missing evidence, not a pass.

- name: kill-is-semantic
  where: ".local/prechecks/packets/**/kill-is-semantic/*.md"
  each: file
  min: 80
  gate: false
  ensure: >
    This rule concerns code that decides whether a mutant is killed: the kill predicate and the code that runs
    mutants and records their observations. A kill must come from a semantic observation: the mutant runs to a
    well-formed answer and that answer differs from a reference or frozen expectation. A run that merely fails
    to agree with its expectation is not yet a wrong answer. For each outcome that must never count as a kill (a
    crash or signal, a timeout, a harness or tool limit, a host or infrastructure failure, a torn or truncated
    read, a text-only match), trace what the shown code records for it and whether the kill predicate would then
    count the mutant as killed. The rule is broken when a disagreement is counted as a kill without first
    establishing that the run ended in a well-formed answer, even if the killed set is later compared with an
    expected list; when a predicate counts any difference between observations and one of those outcomes yields
    a differing observation (for example an empty result on timeout); when a set of exits or outcomes accepted
    as a well-formed answer includes one the packet defines as a harness limit, crash, host failure or timeout;
    when a fault filter removes only some of those outcomes before kills are counted; or when a kill is credited
    because a name or substring appears in text output rather than because a value differs from its reference. A
    predicate that first requires the run to succeed, or pins its observation to a well-formed outcome (a fixed
    set of verdict exits, an exact registered diagnostic, a completed status), and only then compares it with
    the frozen expectation holds, even when a failed comparison is caught as the kill; so does a fault that
    fails the gate instead of counting, and an equivalent mutant reported separately with a reason. An exact
    outcome the mutant is registered to produce is a semantic observation whatever its class. If the packet
    shows no code that decides kills and its Claim says nothing about what counts as a kill, the rule holds; if
    the Claim says what counts as a kill but the code that decides it is not shown, missing evidence is not a
    pass.

- name: required-laws-met
  where: ".local/prechecks/packets/**/required-laws-met/*.md"
  each: file
  min: 80
  gate: false
  ensure: >
    This rule compares the required laws listed in the Claim with the operation-to-law matrix and the recorded
    obligations in the Evidence. For each required law, find the law or laws whose statements establish it in
    the generality it states (all, any, arbitrary, for every value), reading the for-binder count of each: a law
    with 0 binders is one fixed instance (a ground witness) whatever its name, and a one-step or helper law does
    not establish a whole theorem unless the requirement asks for it. The rule is broken when a required law is
    established only by ground witnesses, only by laws narrower than it states (fewer cases, or a fixed size or
    value where it says all or any), or by no law at all, and no recorded obligation names it as open with its
    evidence. The rule holds when each required law maps to universally quantified laws (binders above zero)
    that state it, or to a recorded open obligation. Ground witnesses and other laws that no requirement asks
    for are not violations, and a clause of a requirement that states a limit or disclaimer rather than a
    property needs no law. Missing evidence is not a pass: a required law whose deciding law is absent from the
    matrix breaks the rule.
