# Perch 0.3.5. Rules below are drafts, not a compiler correctness gate.
# npm postinstall enables the pinned Bend parser; check actual rule coverage.
scan_types: [defect, security, lint]
ignore:
  - ".env"
  - ".env.*"
  - ".toolchain/**"
  - ".local/**"
  - "generated/**"
  - "tests/negative/**"
  - "tests/fixtures/invalid/**"
  - "tests/perch-performance/**"
  - "tests/perch-performance-growth/**"
  - "docs/perch-experiments/**"
rules: []
