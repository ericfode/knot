<title>Knot Taste Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --paper: #eceef1;
    --sheet: #ffffff;
    --ink: #12151b;
    --muted: #5a6270;
    --rule: #cfd4dc;
    --accent: #2743ff;
    --accent-ink: #ffffff;
    --more: #0f8a4a;
    --meh: #7b8290;
    --much: #c2186b;
    --code-bg: #f6f7f9;
    --kw: #2743ff;
    --ctor: #a2410f;
    --com: #6d7582;
    --num: #0f7a70;
    --focus: #ff9f1c;
    --shadow: 0 1px 0 rgba(18, 21, 27, .06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0f1216; --sheet: #171b21; --ink: #e7eaf0; --muted: #9aa3b2; --rule: #2a313b;
      --accent: #7c8cff; --accent-ink: #0b0d12; --more: #35c47a; --meh: #8a93a3; --much: #ff5fa8;
      --code-bg: #12161b; --kw: #8f9dff; --ctor: #f0a15f; --com: #7f8898; --num: #55d0c4;
      --shadow: 0 1px 0 rgba(0, 0, 0, .4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0f1216; --sheet: #171b21; --ink: #e7eaf0; --muted: #9aa3b2; --rule: #2a313b;
    --accent: #7c8cff; --accent-ink: #0b0d12; --more: #35c47a; --meh: #8a93a3; --much: #ff5fa8;
    --code-bg: #12161b; --kw: #8f9dff; --ctor: #f0a15f; --com: #7f8898; --num: #55d0c4;
    --shadow: 0 1px 0 rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font: 16px/1.55 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-inline: 16px; padding-block: 0 64px;
  }
  .wrap { max-width: 1320px; margin: 0 auto; }
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding-block: 12px; border-bottom: 1px solid var(--rule);
  }
  .brand { font: 800 20px/1 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -.01em; }
  .brand span { color: var(--accent); }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .steps button {
    font: 600 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .04em;
    border: 1px solid var(--rule); background: var(--sheet); color: var(--muted);
    padding: 7px 9px; border-radius: 6px; cursor: pointer;
  }
  .steps button[aria-current="step"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .steps button.done { color: var(--more); border-color: var(--more); }
  .save { font: 12px/1 "JetBrains Mono", monospace; color: var(--muted); min-width: 9ch; }
  h1, h2 { font-family: "Bricolage Grotesque", system-ui, sans-serif; text-wrap: balance; letter-spacing: -.015em; }
  h1 { font-size: clamp(30px, 5vw, 52px); line-height: 1.02; font-weight: 800; margin: 36px 0 12px; max-width: 18ch; }
  h2 { font-size: clamp(22px, 3vw, 30px); line-height: 1.1; font-weight: 800; margin: 28px 0 6px; }
  .lede { max-width: 62ch; color: var(--muted); margin: 0 0 18px; }
  .contract {
    max-width: 78ch; font-size: 15px; background: var(--sheet); border: 1px solid var(--rule);
    border-radius: 8px; padding: 10px 14px; margin: 0 0 18px;
  }
  .contract b { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 8px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); align-items: start; }
  .card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; }
  .card.best { border-color: var(--more); box-shadow: 0 0 0 2px var(--more); }
  .card.worst { border-color: var(--much); box-shadow: 0 0 0 2px var(--much); }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .letter { font: 800 22px/1 "Bricolage Grotesque", sans-serif; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 7px; background: var(--ink); color: var(--paper); }
  .lines { font: 12px/1 "JetBrains Mono", monospace; color: var(--muted); }
  .picks { margin-left: auto; display: flex; gap: 6px; }
  pre.code {
    margin: 0; padding: 12px 14px; overflow: auto; max-height: 560px; background: var(--code-bg);
    font: 12.5px/1.5 "JetBrains Mono", ui-monospace, Menlo, monospace; tab-size: 2; white-space: pre;
  }
  .tok-kw { color: var(--kw); font-weight: 600; }
  .tok-ctor { color: var(--ctor); }
  .tok-com { color: var(--com); font-style: italic; }
  .tok-num { color: var(--num); }
  .react { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--rule); }
  .react button, .chip, .pick, .scale button, .nav button, .reveal-btn {
    font: 700 13px/1.2 "Atkinson Hyperlegible", sans-serif; cursor: pointer; color: var(--ink);
    background: transparent; border: 0;
  }
  .react button { padding: 11px 6px; border-right: 1px solid var(--rule); }
  .react button:last-child { border-right: 0; }
  .react button[aria-pressed="true"][data-v="more"] { background: var(--more); color: #fff; }
  .react button[aria-pressed="true"][data-v="meh"] { background: var(--meh); color: #fff; }
  .react button[aria-pressed="true"][data-v="much"] { background: var(--much); color: #fff; }
  .pick { border: 1px solid var(--rule); border-radius: 999px; padding: 5px 10px; font-size: 12px; }
  .pick[data-k="best"][aria-pressed="true"] { background: var(--more); border-color: var(--more); color: #fff; }
  .pick[data-k="worst"][aria-pressed="true"] { background: var(--much); border-color: var(--much); color: #fff; }
  .note { width: 100%; border: 0; border-top: 1px solid var(--rule); background: transparent; color: var(--ink); font: 14px/1.4 "Atkinson Hyperlegible", sans-serif; padding: 9px 12px; border-radius: 0 0 10px 10px; }
  .note::placeholder { color: var(--muted); }
  .duel { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; align-items: start; }
  @media (max-width: 880px) { .duel { grid-template-columns: 1fr; } }
  .panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; margin-top: 16px; }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .scale button { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 6px; background: var(--sheet); }
  .scale button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { border: 1px solid var(--rule); border-radius: 999px; padding: 6px 11px; font-size: 13px; background: var(--sheet); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .panel .note { border: 1px solid var(--rule); border-radius: 8px; margin-top: 12px; }
  .nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 24px; flex-wrap: wrap; }
  .nav button { border-radius: 8px; padding: 12px 18px; border: 1px solid var(--rule); background: var(--sheet); }
  .nav button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .nav .hint { color: var(--muted); font-size: 14px; }
  textarea.long { width: 100%; min-height: 96px; border: 1px solid var(--rule); border-radius: 8px; padding: 12px; background: var(--sheet); color: var(--ink); font: 16px/1.5 "Atkinson Hyperlegible", sans-serif; }
  label.q { display: block; font-weight: 700; margin: 18px 0 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--muted); margin: 0 0 16px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .banner { border: 1px solid var(--much); color: var(--much); border-radius: 8px; padding: 10px 14px; margin-top: 16px; }
  table.reveal { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.reveal th, table.reveal td { text-align: left; border-bottom: 1px solid var(--rule); padding: 8px 10px; vertical-align: top; }
  .tablewrap { overflow-x: auto; }
  .reveal-btn { border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 10px 14px; background: var(--sheet); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { .card, .scale button, .react button { transition: box-shadow .15s, background-color .15s, color .15s; } }
</style>

<script>
const DATA = {"tasks": [{"id": "bitpath", "title": "Walk a bit path", "contract": "A persistent map from 8-bit keys to U32 values, stored as a binary trie that the key's bits walk low bit first to depth 8. Lookup answers None or Some(value), insert overwrites, and remove collapses any fork left with two empty sides.", "order": ["vd1bac946", "v2e808a01", "v7fb559be", "v8d43c460", "v0e44abe6", "v0ef98da6"]}, {"id": "fuel", "title": "Give work its fuel", "contract": "A countdown task run on a fuel budget: each step sets total := total·3 + remaining mod 7, then remaining := remaining − 1. At remaining 0 the task is Done(total); if fuel runs out first, the unfinished task comes back as Owed(task), so running with a + b fuel equals running a, then b.", "order": ["vf7786a52", "v28303cb8", "v85d65d85", "v80e3082e", "vab78dfd5", "v8b646826"]}, {"id": "pipeline", "title": "Stop at the first error", "contract": "Read a list of character codes through three stages, where the earliest failure wins: lex (digits and commas only), parse (number, comma, number …) and check (each number at most 1000 and strictly increasing). Success returns the sum; failure returns the stage and a position.", "order": ["vdcb6f98b", "vab31c1fe", "vb6a22e8f", "va5b222ef", "vdc97b1ef", "vd63e099b"]}, {"id": "slots", "title": "Refusal returns the offer", "contract": "A four-slot store that is passed in and handed back, never copied. put fills the lowest empty slot and returns its index, or, when every slot is full, refuses and hands the offered value back untouched. take empties a slot and returns its value, or reports it missing.", "order": ["v32385ad2", "vc462cdf1", "v6da1b12b", "v13eac061", "v70c35671", "v6272ee3e"]}], "variants": {"v0e44abe6": {"code": "import Base\n\ntype MapNode is Data:\n  EmptyMapNode{}\n  ValueMapNode{stored_value: U32}\n  BranchMapNode{left_child_node: MapNode, right_child_node: MapNode}\n\ndef convert_key_to_list_of_bits(number_of_bits: Nat, +key_value: U32) -> List<&2, Bool>:\n  match number_of_bits:\n    case 0n:\n      Nil{}\n    case 1n+remaining_number_of_bits:\n      lowest_bit_value : U32 = U32.and(key_value, 1)\n      lowest_bit_is_set : Bool = U32.is_eq(lowest_bit_value, 1)\n      shifted_key_value : U32 = U32.shr(key_value)\n      Con{lowest_bit_is_set, convert_key_to_list_of_bits(remaining_number_of_bits, shifted_key_value)}\n\ndef find_value_for_key_bits(key_bits: List<&2, Bool>, map_node: MapNode) -> Maybe<&2, U32>:\n  match key_bits map_node:\n    case Nil{} ValueMapNode{stored_value}:\n      Some{stored_value}\n    case Con{False{}, remaining_key_bits} BranchMapNode{left_child_node, right_child_node}:\n      find_value_for_key_bits(remaining_key_bits, left_child_node)\n    case Con{True{}, remaining_key_bits} BranchMapNode{left_child_node, right_child_node}:\n      find_value_for_key_bits(remaining_key_bits, right_child_node)\n    case other_key_bits other_map_node:\n      None{}\n\ndef insert_value_for_key_bits(key_bits: List<&2, Bool>, map_node: MapNode, new_value: U32) -> MapNode:\n  match key_bits map_node:\n    case Nil{} existing_map_node:\n      ValueMapNode{new_value}\n    case Con{False{}, remaining_key_bits} BranchMapNode{left_child_node, right_child_node}:\n      new_left_child_node : MapNode = insert_value_for_key_bits(remaining_key_bits, left_child_node, new_value)\n      BranchMapNode{new_left_child_node, right_child_node}\n    case Con{True{}, remaining_key_bits} BranchMapNode{left_child_node, right_child_node}:\n      new_right_child_node : MapNode = insert_value_for_key_bits(remaining_key_bits, right_child_node, new_value)\n      BranchMapNode{left_child_node, new_right_child_node}\n    case Con{False{}, remaining_key_bits} existing_map_node:\n      BranchMapNode{insert_value_for_key_bits(remaining_key_bits, EmptyMapNode{}, new_value), EmptyMapNode{}}\n    case Con{True{}, remaining_key_bits} existing_map_node:\n      BranchMapNode{EmptyMapNode{}, insert_value_for_key_bits(remaining_key_bits, EmptyMapNode{}, new_value)}\n\ndef make_branch_node_or_empty_node(left_child_node: MapNode, right_child_node: MapNode) -> MapNode:\n  match left_child_node right_child_node:\n    case EmptyMapNode{} EmptyMapNode{}:\n      EmptyMapNode{}\n    case other_left_child_node other_right_child_node:\n      BranchMapNode{other_left_child_node, other_right_child_node}\n\ndef remove_value_for_key_bits(key_bits: List<&2, Bool>, map_node: MapNode) -> MapNode:\n  match key_bits map_node:\n    case Nil{} existing_map_node:\n      EmptyMapNode{}\n    case Con{False{}, remaining_key_bits} BranchMapNode{left_child_node, right_child_node}:\n      new_left_child_node : MapNode = remove_value_for_key_bits(remaining_key_bits, left_child_node)\n      make_branch_node_or_empty_node(new_left_child_node, right_child_node)\n    case Con{True{}, remaining_key_bits} BranchMapNode{left_child_node, right_child_node}:\n      new_right_child_node : MapNode = remove_value_for_key_bits(remaining_key_bits, right_child_node)\n      make_branch_node_or_empty_node(left_child_node, new_right_child_node)\n    case other_key_bits other_map_node:\n      other_map_node\n\ndef find_value_for_key_in_map(map: MapNode, key: U32) -> Maybe<&2, U32>:\n  key_bits : List<&2, Bool> = convert_key_to_list_of_bits(8n, key)\n  found_value : Maybe<&2, U32> = find_value_for_key_bits(key_bits, map)\n  found_value\n\ndef insert_value_for_key_in_map(map: MapNode, key: U32, value: U32) -> MapNode:\n  key_bits : List<&2, Bool> = convert_key_to_list_of_bits(8n, key)\n  new_map : MapNode = insert_value_for_key_bits(key_bits, map, value)\n  new_map\n\ndef remove_value_for_key_in_map(map: MapNode, key: U32) -> MapNode:\n  key_bits : List<&2, Bool> = convert_key_to_list_of_bits(8n, key)\n  new_map : MapNode = remove_value_for_key_bits(key_bits, map)\n  new_map\n", "lines": 77}, "v0ef98da6": {"code": "import Base\n\n# A depth-d trie is 2^d slots; a key, read low bit first, names one.\n# One bit-indexed pair, pick and place, is the entire structure:\n#\n#   law  pick(b, place(b, x, y))  = x       retract\n#   law  pick(¬b, place(b, x, y)) = y       frame\n#   law  place(b, Hole, Hole)     = Hole    collapse: no fork of two holes\n#\n# zoom and graft iterate the pair d times, so by induction on d\n#   law  zoom(k, graft(k, x, t))  = x       lens\n# and the API is three one-liners. Deletion is grafting a hole.\n\ntype Trie is Data:\n  Hole{}\n  Slot{v: U32}\n  Fork{l: Trie, r: Trie}\n\ndef pick(b: Bool, t: Trie) -> Trie:\n  match b t:\n    case False{} Fork{l, r}: l\n    case True{}  Fork{l, r}: r\n    case _       _:          Hole{}\n\ndef place(b: Bool, x: Trie, y: Trie) -> Trie:\n  match b x y:\n    case _       Hole{} Hole{}: Hole{}\n    case False{} x      y:      Fork{x, y}\n    case True{}  x      y:      Fork{y, x}\n\ndef bit(+k: U32) -> Bool: Bool.not(U32.is_even(k))\n\ndef zoom(d: Nat, +k: U32, t: Trie) -> Trie:\n  match d:\n    case 0n:   t\n    case 1n+d: zoom(d, U32.shr(k), pick(bit(k), t))\n\ndef graft(d: Nat, +k: U32, x: Trie, +t: Trie) -> Trie:\n  match d:\n    case 0n:   x\n    case 1n+d:\n      +b = bit(k)\n      place(b, graft(d, U32.shr(k), x, pick(b, t)), pick(Bool.not(b), t))\n\ndef slot(t: Trie) -> +Maybe<U32>:\n  match t:\n    case Slot{v}: Some{v}\n    case _:       None{}\n\ndef get(t: Trie, k: U32) -> +Maybe<U32>: slot(zoom(8n, k, t))\ndef put(t: Trie, k: U32, v: U32) -> Trie:  graft(8n, k, Slot{v}, t)\ndef del(t: Trie, k: U32) -> Trie:          graft(8n, k, Hole{}, t)\n", "lines": 52}, "v2e808a01": {"code": "import Base\n\n# ⟡ THE LOOM ⟡   Clotho spins · Lachesis measures · Atropos cuts\n#   a thread is eight crossings, low first:   over is 0 · under is 1\n#   slack in, slack out;   two slacks cinch to slack.\n\ntype Loom is Data:\n  Slack{}\n  Bead{bead: U32}\n  Warp{over: Loom, under: Loom}\n\ntype Cross is Data:\n  Over{}\n  Under{}\n\n# ─── the thread, told as crossings ────────────────────────────\ndef cross(+thread: U32) -> Cross:\n  Bool.pick(Cross, U32.is_even(thread), Over{}, Under{})\n\ndef weave(n: Nat, +thread: U32) -> +List<Cross>:\n  match n:\n    case 0n:   Nil{}\n    case 1n+n: cross(thread) <> weave(n, U32.shr(thread))\n\n# ─── the loom, felt by hand ───────────────────────────────────\ndef over(loom: Loom) -> Loom:\n  match loom:\n    case Warp{o, u}: o\n    case _:          Slack{}\n\ndef under(loom: Loom) -> Loom:\n  match loom:\n    case Warp{o, u}: u\n    case _:          Slack{}\n\ndef bead(loom: Loom) -> +Maybe<U32>:\n  match loom:\n    case Bead{b}: Some{b}\n    case _:       None{}\n\ndef cinch(o: Loom, u: Loom) -> Loom:\n  match o u:\n    case Slack{} Slack{}: Slack{}\n    case o       u:       Warp{o, u}\n\n# ─── the three sisters ────────────────────────────────────────\n# Lachesis measures:   over, under,   and read the bead.\ndef lachesis(w: +List<Cross>, +loom: Loom) -> +Maybe<U32>:\n  match w:\n    case Nil{}:           bead(loom)\n    case Con{Over{},  w}: lachesis(w, over(loom))\n    case Con{Under{}, w}: lachesis(w, under(loom))\n\n# Clotho spins:        over, under,   and lay the bead.\ndef clotho(w: +List<Cross>, b: U32, +loom: Loom) -> Loom:\n  match w:\n    case Nil{}:           Bead{b}\n    case Con{Over{},  w}: Warp{clotho(w, b, over(loom)), under(loom)}\n    case Con{Under{}, w}: Warp{over(loom), clotho(w, b, under(loom))}\n\n# Atropos cuts:        over, under,   and let it slack.\ndef atropos(w: +List<Cross>, +loom: Loom) -> Loom:\n  match w:\n    case Nil{}:           Slack{}\n    case Con{Over{},  w}: cinch(atropos(w, over(loom)), under(loom))\n    case Con{Under{}, w}: cinch(over(loom), atropos(w, under(loom)))\n\n# ─── at the loom ──────────────────────────────────────────────\ndef measure(loom: Loom, thread: U32) -> +Maybe<U32>: lachesis(weave(8n, thread), loom)\ndef spin(loom: Loom, thread: U32, b: U32) -> Loom:    clotho(weave(8n, thread), b, loom)\ndef cut(loom: Loom, thread: U32) -> Loom:             atropos(weave(8n, thread), loom)\n", "lines": 71}, "vd1bac946": {"code": "import Base\n\n# ╔═══════════════════════════════════════════════════════════════════════╗\n# ║  ⚜ ⚜ ⚜   THE MOST SERENE OCTAVIAN REGISTRY OF SOVEREIGN VALUES   ⚜ ⚜ ⚜  ║\n# ║     wherein Eight Noble Bits, in strict Order of Precedence,          ║\n# ║     do Adjudicate every Petition brought humbly before the Throne     ║\n# ║                ~ Ratified Anno Compilatoris MMXXVI ~                  ║\n# ╚═══════════════════════════════════════════════════════════════════════╝\n\ntype Realm is Data:                                   # ❦ THE CONSTITUTION ❦\n  VacantThrone{}                                      #   ∅  wherein no Sovereign reigneth\n  EnthronedSovereign{regalia: U32}                    #   ♛  a Value, duly Crowned\n  BifurcatedDominion{sinister: Realm, dexter: Realm}  #   ⚔  a Realm, Partitioned in Twain\ntype Petition is Data:                                # ✉ a Key, Sealed in Crimson Wax\n  SealedPetition{sigil: U32}\n\n# ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄ ✠ BOOK THE FIRST ✠ Of Heralds & Ceremony ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄\ndef Ceremony.affix_the_royal_seal(sigil: U32) -> Petition: SealedPetition{sigil}\ndef Ceremony.solemnize(realm: Realm) -> Realm: realm   # ✠ it returneth the Realm Unaltered, as Tradition Demandeth\ndef Herald.proclaim_sinister_allegiance(petition: Petition) -> Bool:\n  match petition:\n    case SealedPetition{sigil}: U32.is_even(sigil)    # ⚑ the Lowest Bit speaketh First\ndef Herald.elevate_to_the_next_rank(petition: Petition) -> Petition:\n  match petition:\n    case SealedPetition{sigil}: Ceremony.affix_the_royal_seal(U32.shr(sigil))\n\n# ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄ ✠ BOOK THE SECOND ✠ Of the Provinces ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄\ndef Cartographer.survey_the_sinister_province(realm: Realm) -> Realm:\n  match realm:\n    case BifurcatedDominion{sinister, dexter}: Ceremony.solemnize(sinister)\n    case _:                                    VacantThrone{}\ndef Cartographer.survey_the_dexter_province(realm: Realm) -> Realm:\n  match realm:\n    case BifurcatedDominion{sinister, dexter}: Ceremony.solemnize(dexter)\n    case _:                                    VacantThrone{}\ndef Cartographer.consult_the_atlas(sinister_allegiance: Bool, +realm: Realm) -> Realm:\n  Bool.pick(Realm, sinister_allegiance,\n    Cartographer.survey_the_sinister_province(realm), Cartographer.survey_the_dexter_province(realm))\ndef Parliament.convene(sinister: Realm, dexter: Realm) -> Realm:   # ⚖ an Empty Parliament Dissolveth\n  match sinister dexter:\n    case VacantThrone{} VacantThrone{}: VacantThrone{}\n    case s d:                           BifurcatedDominion{s, d}\ndef Treasury.appraise_the_regalia(realm: Realm) -> +Maybe<U32>:\n  match realm:\n    case EnthronedSovereign{regalia}: Some{regalia}\n    case _:                           None{}\n\n# ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄ ✠ BOOK THE THIRD ✠ Of the Three Solemn Descents ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄\ndef Chancery.the_solemn_descent_of_inquiry(rank: Nat, +petition: Petition, realm: Realm) -> +Maybe<U32>:\n  match rank:\n    case 0n: Treasury.appraise_the_regalia(Ceremony.solemnize(realm))\n    case 1n+rank: Chancery.the_solemn_descent_of_inquiry(rank, Herald.elevate_to_the_next_rank(petition),\n      Cartographer.consult_the_atlas(Herald.proclaim_sinister_allegiance(petition), realm))\ndef Chancery.the_solemn_descent_of_coronation(rank: Nat, +petition: Petition, regalia: U32, +realm: Realm) -> Realm:\n  match rank:\n    case 0n: EnthronedSovereign{regalia}\n    case 1n+rank:\n      +allegiance = Herald.proclaim_sinister_allegiance(petition)\n      +heir = Chancery.the_solemn_descent_of_coronation(rank, Herald.elevate_to_the_next_rank(petition), regalia,\n        Cartographer.consult_the_atlas(allegiance, realm))\n      Bool.pick(Realm, allegiance, BifurcatedDominion{heir, Cartographer.survey_the_dexter_province(realm)},\n        BifurcatedDominion{Cartographer.survey_the_sinister_province(realm), heir})\ndef Chancery.the_solemn_descent_of_deposition(rank: Nat, +petition: Petition, +realm: Realm) -> Realm:\n  match rank:\n    case 0n: VacantThrone{}\n    case 1n+rank:\n      +allegiance = Herald.proclaim_sinister_allegiance(petition)\n      +remnant = Chancery.the_solemn_descent_of_deposition(rank, Herald.elevate_to_the_next_rank(petition),\n        Cartographer.consult_the_atlas(allegiance, realm))\n      Bool.pick(Realm, allegiance, Parliament.convene(remnant, Cartographer.survey_the_dexter_province(realm)),\n        Parliament.convene(Cartographer.survey_the_sinister_province(realm), remnant))\n\n# ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄ ✠ BOOK THE FOURTH ✠ Of the Royal Audience ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄\ndef Throne.grant_audience_for_inquiry(realm: Realm, sigil: U32) -> +Maybe<U32>:     # 🜲 Hear Ye\n  Chancery.the_solemn_descent_of_inquiry(8n, Ceremony.affix_the_royal_seal(sigil), Ceremony.solemnize(realm))\ndef Throne.crown_a_sovereign(realm: Realm, sigil: U32, regalia: U32) -> Realm:     # ♛ Long May It Reign\n  Chancery.the_solemn_descent_of_coronation(8n, Ceremony.affix_the_royal_seal(sigil), regalia, Ceremony.solemnize(realm))\ndef Throne.depose_a_sovereign(realm: Realm, sigil: U32) -> Realm:                  # ⚰ Sic Transit Gloria\n  Chancery.the_solemn_descent_of_deposition(8n, Ceremony.affix_the_royal_seal(sigil), Ceremony.solemnize(realm))\n", "lines": 79}, "v7fb559be": {"code": "import Base\ntype T is Data:\n  E{}\n  V{v:U32}\n  B{l:T,r:T}\ndef o(b:Bool,t:T)->T:\n  match b t:\n    case _ E{}:B{E{},E{}}\n    case _ B{E{},E{}}:E{}\n    case False{} B{l,r}:B{r,l}\n    case _ t:t\ndef m(k:U32,t:T)->T:o(U32.is_even(k),t)\ndef h(k:U32)->U32:U32.shr(k)\ndef g(n:Nat,+k:U32,t:T)->+Maybe<U32>:\n  match n t:\n    case 0n V{v}:Some{v}\n    case 1n+n B{l,_}:g(n,h(k),m(k,l))\n    case _ _:None{}\ndef a(n:Nat,+k:U32,x:T,t:T)->T:\n  match n t:\n    case 0n _:m(k,x)\n    case 1n+n B{l,r}:B{m(k,a(n,h(k),x,m(k,l))),r}\n    case _ t:t\ndef q(t:T,+k:U32)->+Maybe<U32>:g(8n,h(k),m(k,t))\ndef s(t:T,+k:U32,v:U32)->T:m(k,a(8n,h(k),V{v},m(k,t)))\ndef d(t:T,+k:U32)->T:m(k,a(8n,h(k),E{},m(k,t)))\n", "lines": 26}, "v8d43c460": {"code": "import Base\n\n# ══ A map from bytes to numbers, told as a walk through a maze ═════════\n#\n# Picture every key as a list of directions. A key below 256 has eight\n# bits, and we read them from the lowest one up. Each bit is one turn:\n# 0 means left, 1 means right. After exactly eight turns you are standing\n# in the one room that belongs to that key. That is the whole idea. The\n# rest of this file is only learning how to walk, and it comes in two\n# parts: first we learn to look, and then we learn to change things.\n#\n# The maze is built from three kinds of room:\ntype ByteMap is Data:\n  Nothing{}                              # an empty room; nothing lies past it\n  Stored{value: U32}                     # the room at the end of a walk\n  Branch{left: ByteMap, right: ByteMap}  # a fork in the road\n\n# Before the first step, a promise we will keep until the very last line:\n# no Branch ever has Nothing on both sides. An empty map is just Nothing,\n# never a hollow tangle of forks that lead nowhere. Hold on to that.\n#\n# At every fork we ask the key two small questions. Which way now? And\n# which directions are still left once we have made this turn?\ndef goes_left(+key: U32) -> Bool: U32.is_eq((key % 2 : U32), 0)\ndef rest_of(key: U32) -> U32: (key / 2 : U32)\n# ── Part one: looking ─────────────────────────────────────────────────\n# The easy walk. Count eight steps down, turning wherever the key says.\n# If a value is waiting at the end, that is our answer. If the road runs\n# out early, the key was never stored at all.\ndef lookup_walk(steps: Nat, +key: U32, map: ByteMap) -> +Maybe<U32>:\n  match steps map:\n    case 0n Stored{value}: Some{value}\n    case 1n+steps Branch{left, right}:\n      lookup_walk(steps, rest_of(key), Bool.pick(ByteMap, goes_left(key), left, right))\n    case _ _: None{}\n# Notice that looking never builds anything. The next walk will have to.\n# ── Part two: changing ────────────────────────────────────────────────\n# Changing the maze is harder, because every fork we pass through must\n# be rebuilt on our way back out. So this time we carry something with\n# us: a value to set down in the last room. And now, the crucial move.\n# Removing a key is exactly the same walk. We simply carry Nothing.\n#\n# Remember the promise? This is where it bites. Setting Nothing down can\n# hollow out a fork, so every fork we rebuild passes one small gate:\ndef tidy(left: ByteMap, right: ByteMap) -> ByteMap:\n  match left right:\n    case Nothing{} Nothing{}: Nothing{}  # a fork to nowhere is no fork\n    case l r: Branch{l, r}\n# One last detail. A road that nobody has built yet is simply a fork\n# with two empty sides, so before we step onto it, we open it up.\ndef open_up(map: ByteMap) -> ByteMap:\n  match map:\n    case Nothing{}: Branch{Nothing{}, Nothing{}}\n    case room: room\n# And now, at last, we can walk.\ndef walk(steps: Nat, +key: U32, carried: ByteMap, map: ByteMap) -> ByteMap:\n  match steps map:\n    case 0n _: carried                   # the last room: set down the load\n    case 1n+steps Branch{+left, +right}:\n      # First, face the way the key points;\n      ahead = Bool.pick(ByteMap, goes_left(key), left, right)\n      # then walk on into it, and change whatever lies there;\n      +changed = walk(steps, rest_of(key), carried, open_up(ahead))\n      # and finally, on the way back out, rebuild this fork through the gate.\n      Bool.pick(ByteMap, goes_left(key), tidy(changed, right), tidy(left, changed))\n    case _ room: room                    # never reached: open_up hands us forks\n# ── Epilogue: three front doors, and every walk is eight steps long ───\ndef lookup(map: ByteMap, key: U32) -> +Maybe<U32>: lookup_walk(8n, key, map)\ndef insert(map: ByteMap, key: U32, value: U32) -> ByteMap: walk(8n, key, Stored{value}, open_up(map))\ndef remove(map: ByteMap, key: U32) -> ByteMap: walk(8n, key, Nothing{}, open_up(map))\n# Look closely: remove really is insert, carrying Nothing. And the promise\n# held to the very last line, because tidy guarded every fork we rebuilt.\n", "lines": 72}, "vf7786a52": {"code": "import Base\n\n# Task state record.\ntype TaskStateRecord is Data:\n  TaskStateRecord{remaining_units_value: U32, accumulated_total_value: U32}\n\n# Task execution outcome.\ntype TaskExecutionOutcome is Data:\n  TaskExecutionOutcomeCompleted{final_accumulated_total_value: U32}\n  TaskExecutionOutcomeNotCompleted{not_completed_task_state_record: TaskStateRecord}\n\n# Gets the remaining units value.\ndef get_remaining_units_value(task_state_record: TaskStateRecord) -> U32:\n  match task_state_record:\n    case TaskStateRecord{remaining_units_value, accumulated_total_value}:\n      remaining_units_value\n\n# Gets the accumulated total value.\ndef get_accumulated_total_value(task_state_record: TaskStateRecord) -> U32:\n  match task_state_record:\n    case TaskStateRecord{remaining_units_value, accumulated_total_value}:\n      accumulated_total_value\n\n# Checks if the task is complete.\ndef check_if_task_is_complete(task_state_record: TaskStateRecord) -> Bool:\n  remaining_units_value = get_remaining_units_value(task_state_record)\n  is_task_complete = U32.is_eq(remaining_units_value, 0)\n  is_task_complete\n\n# Performs the single task step.\ndef perform_single_task_step(+task_state_record: TaskStateRecord) -> TaskStateRecord:\n  +current_remaining_units_value = get_remaining_units_value(task_state_record)\n  current_accumulated_total_value = get_accumulated_total_value(task_state_record)\n  multiplied_accumulated_total_value = U32.mul(current_accumulated_total_value, 3)\n  remaining_units_modulo_value = U32.mod(current_remaining_units_value, 7)\n  next_accumulated_total_value = U32.add(multiplied_accumulated_total_value, remaining_units_modulo_value)\n  next_remaining_units_value = U32.sub(current_remaining_units_value, 1)\n  next_task_state_record = {TaskStateRecord{next_remaining_units_value, next_accumulated_total_value} : TaskStateRecord}\n  next_task_state_record\n\n# Runs the task with the fuel amount and the completion check result.\ndef run_task_with_fuel_amount_and_completion_check_result(\n  fuel_amount: Nat, is_task_complete: Bool, +task_state_record: TaskStateRecord\n) -> TaskExecutionOutcome:\n  match fuel_amount is_task_complete:\n    case _ True{}:\n      final_accumulated_total_value = get_accumulated_total_value(task_state_record)\n      completed_outcome = {TaskExecutionOutcomeCompleted{final_accumulated_total_value} : TaskExecutionOutcome}\n      completed_outcome\n    case 0n False{}:\n      not_completed_outcome = {TaskExecutionOutcomeNotCompleted{task_state_record} : TaskExecutionOutcome}\n      not_completed_outcome\n    case 1n+remaining_fuel_amount False{}:\n      +next_task_state_record = perform_single_task_step(task_state_record)\n      next_is_task_complete = check_if_task_is_complete(next_task_state_record)\n      next_outcome = run_task_with_fuel_amount_and_completion_check_result(\n        remaining_fuel_amount, next_is_task_complete, next_task_state_record)\n      next_outcome\n\n# Runs the task execution outcome with the fuel amount.\ndef run_task_execution_outcome_with_fuel_amount(\n  fuel_amount: Nat, task_execution_outcome: TaskExecutionOutcome\n) -> TaskExecutionOutcome:\n  match task_execution_outcome:\n    case TaskExecutionOutcomeCompleted{final_accumulated_total_value}:\n      completed_outcome = {TaskExecutionOutcomeCompleted{final_accumulated_total_value} : TaskExecutionOutcome}\n      completed_outcome\n    case TaskExecutionOutcomeNotCompleted{+not_completed_task_state_record}:\n      is_task_complete = check_if_task_is_complete(not_completed_task_state_record)\n      result_outcome = run_task_with_fuel_amount_and_completion_check_result(\n        fuel_amount, is_task_complete, not_completed_task_state_record)\n      result_outcome\n", "lines": 72}, "v80e3082e": {"code": "import Base\n\n# One move, iterated. Fuel is its exponent; Paid is its fixed point.\n#\n#   owe(0, v)        = Paid v                     the only zero test\n#   tick(Paid v)     = Paid v                     paid never moves\n#   tick(Owed r v)   = owe(r - 1, 3v + r mod 7)   the only real work\n#   run(n)           = tickⁿ                      fuel is an exponent\n#   ────────────────────────────────────────────────────────────────\n#   law: run(m) ∘ run(n) = run(n + m)             proved: run_compose\n\ntype Outcome is Data:\n  Paid{v: U32}\n  Owed{r: U32, v: U32}\n\ndef owe(+r: U32, +v: U32) -> Outcome:\n  Bool.pick(Outcome, U32.is_zero(r), Paid{v}, Owed{r, v})\n\ndef tick(o: Outcome) -> Outcome:\n  match o:\n    case Paid{v}:     Paid{v}\n    case Owed{+r, v}: owe((r - 1 : U32), (v * 3 + r % 7 : U32))\n\ndef run(n: Nat, o: Outcome) -> Outcome:\n  match n:\n    case 0n:   o\n    case 1n+k: run(k, tick(o))\n\n# The proof never opens tick: any iterate composes.\nlaw run_compose:\n  for m: Nat\n  for n: Nat\n  for o: Outcome\n  {run(m, run(n, o)) == run(Nat.add(n, m), o) : Outcome}\n\ndef run_compose(m, n, o):\n  match n:\n    case 0n:   {==}\n    case 1n+k: run_compose(m, k, tick(o))\n", "lines": 39}, "v28303cb8": {"code": "import Base\n\n#   what feeds the coal?    breath.\n#   what feeds the heat?    sparks.\n#   what keeps the heat?    ash.\n#   what keeps the ash?     ash.\n\ntype Hearth is Data:\n  Ash{heat: U32}                  # fire out.     heat kept.\n  Coal{sparks: U32, heat: U32}    # fire banked.  sparks kept.\n\ndef cold(sparks: U32)  -> Bool:  U32.is_zero(sparks)   # no sparks, no fire\ndef thrice(heat: U32)  -> U32:   (heat * 3 : U32)      # heat goes thrice\ndef tithe(sparks: U32) -> U32:   (sparks % 7 : U32)    # sparks pay the tithe\n\n# cold coal is ash.     warm coal is banked.     ash stays ash.\ndef bank(+sparks: U32, +heat: U32) -> Hearth:\n  Bool.pick(Hearth, cold(sparks), Ash{heat}, Coal{sparks, heat})\n\n# one spark falls.      heat goes thrice.        the tithe is paid.\ndef stoke(+sparks: U32, heat: U32) -> Hearth:\n  bank((sparks - 1 : U32), (thrice(heat) + tithe(sparks) : U32))\n\n# no breath, no burn.   one breath, one stoke.   ash stays ash.\ndef burn(breath: Nat, hearth: Hearth) -> Hearth:\n  match breath  hearth:\n    case _        Ash{heat}:           Ash{heat}                        # ash stays ash\n    case 0n       Coal{sparks, heat}:  Coal{sparks, heat}               # coal stays coal\n    case 1n+more  Coal{sparks, heat}:  burn(more, stoke(sparks, heat))  # breath feeds coal\n\n#   bank it at dusk.     burn it at dawn.     the hearth forgets the night.\n#   burn(b, burn(a, h))  is  burn(a + b, h).  ash stays ash.\n", "lines": 32}, "v85d65d85": {"code": "import Base\n\n# ╔══════════════════════════════════════════════════════════════════╗\n# ║   ⚜   THE MAGNIFICENT ENGINE OF DEFERRED OBLIGATION   ⚜          ║\n# ║   Wherein LABOUR is advanced against a finite TREASURY, and      ║\n# ║   whatsoever remains unfinished is RETURNED WITH FULL HONOURS.   ║\n# ╚══════════════════════════════════════════════════════════════════╝\n\n# ┌─── ❦ I. The Sovereign Ledger ❦ ──────────────────────────────────┐\ntype SovereignLedgerOfLabour is Data:\n  InscribedLedger{the_outstanding_tribute: U32, the_amassed_treasure: U32}\n\n# ┌─── ❦ II. The Twin Destinies Which Await Every Ledger ❦ ──────────┐\ntype DestinyOfTheLedger is Data:\n  GloriousConsummation{the_final_treasure: U32}\n  SolemnDeferment{the_ledger_returned_with_honour: SovereignLedgerOfLabour}\n\n# ┌─── ❦ III. Of Consecration ❦ ─────────────────────────────────────┐\n# │  The numeral departs precisely as it arrived — yet CONSECRATED.\ndef consecrate(the_numeral: U32) -> U32:\n  the_numeral\n\n# ┌─── ❦ IV. The Rite of Triplication ❦ ─────────────────────────────┐\ndef the_rite_of_triplication(the_treasure: U32) -> U32:\n  consecrate((the_treasure * 3 : U32))\n\n# ┌─── ❦ V. The Exaction of the Septenary Tithe ❦ ───────────────────┐\ndef the_exaction_of_the_septenary_tithe(the_tribute: U32) -> U32:\n  consecrate((the_tribute % 7 : U32))\n\n# ┌─── ❦ VI. The Oracle of the Void ❦ ───────────────────────────────┐\n# │  Herein the Oracle gazes into the Void and names what it sees.\ndef the_oracle_of_the_void(the_tribute: U32) -> Bool:\n  U32.is_zero(consecrate(the_tribute))\n\n# ┌─── ❦ VII. The Pronouncement of Destiny ❦ ────────────────────────┐\ndef the_pronouncement_of_destiny(+the_tribute: U32, +the_treasure: U32) -> DestinyOfTheLedger:\n  Bool.pick(DestinyOfTheLedger, the_oracle_of_the_void(the_tribute),\n    GloriousConsummation{the_treasure},\n    SolemnDeferment{InscribedLedger{the_tribute, the_treasure}})\n\n# ┌─── ❦ VIII. The Innermost Sanctum of Advancement ❦ ───────────────┐\ndef the_innermost_sanctum(+the_tribute: U32, the_treasure: U32) -> DestinyOfTheLedger:\n  the_pronouncement_of_destiny(consecrate((the_tribute - 1 : U32)),\n    (the_rite_of_triplication(the_treasure) + the_exaction_of_the_septenary_tithe(the_tribute) : U32))\n\n# ┌─── ❦ IX. The Ceremony of Advancement ❦ ──────────────────────────┐\n# │  (which, in its wisdom, summons the Sanctum)\ndef the_ceremony_of_advancement(the_destiny: DestinyOfTheLedger) -> DestinyOfTheLedger:\n  match the_destiny:\n    case GloriousConsummation{the_final_treasure}:\n      GloriousConsummation{the_final_treasure}\n    case SolemnDeferment{InscribedLedger{the_tribute, the_treasure}}:\n      the_innermost_sanctum(the_tribute, the_treasure)\n\n# ┌─── ❦ X. The Invocation ❦ ────────────────────────────────────────┐\n# │  (which, in ITS wisdom, summons the Ceremony)\ndef the_invocation(the_destiny: DestinyOfTheLedger) -> DestinyOfTheLedger:\n  the_ceremony_of_advancement(the_destiny)\n\n# ╔══════════════════════════════════════════════════════════════════╗\n# ║   ⚜   XI. THE GRAND ORCHESTRATOR OF METERED LABOUR   ⚜           ║\n# ║   Be it PROCLAIMED throughout the Realm: a Treasury spent in     ║\n# ║   two instalments begets the SELFSAME Destiny as one spent       ║\n# ║   entire. No proof is offered. None is asked of Sovereigns.      ║\n# ╚═════════════════════════ on to land in.\ndef settle_as(finished: Bool, remaining: U32, total: U32) -> Outcome:\n  match finished:\n    case True{}:  Finished{total}\n    case False{}: Owed{Task{remaining, total}}\n\n# Because every Owed task walks through this door, an Owed task always has\n# at least one step left. Remember that; we will need it in a moment.\ndef settle(task: Task) -> Outcome:\n  match task:\n    case Task{+remaining, total}:\n      settle_as(U32.is_zero(remaining), remaining, total)\n\n# And now the crucial move. `run` looks at the fuel and the outcome\n# together, and it can only ever be in one of three situations:\n#   - the job is Finished: it stays put, however much fuel we offer;\n#   - there is no fuel left: we hand the job back exactly as it stands;\n#   - otherwise one unit buys one step, and we go back through the door.\n# Here the promise pays off: an Owed task always has a step to spend on,\n# so `remaining - 1` can never wrap around below zero.\ndef run(fuel: Nat, outcome: Outcome) -> Outcome:\n  match fuel outcome:\n    case _ Finished{total}:  Finished{total}\n    case 0n Owed{task}:      Owed{task}\n    case 1n+left Owed{task}: run(left, settle(step(task)))\n\n# Watch it work, with job = settle(Task{3, 5}):\n#     run(2, job)            Owed{Task{1, 56}}     the job, handed back\n#     run(1, run(2, job))    Finished{169}\n#     run(3, job)            Finished{169}         the same place, at once\n# So run(b, run(a, job)) == run(a + b, job): the pause cost nothing.\n#\n# Quiz answer: finished. `settle` checks `remaining` before anyone asks\n# about fuel, so such a job is Finished before `run` ever sees it.\n", "lines": 67}, "vd63e099b": {"code": "import Base\n\ntype Token is Data:\n  NumberToken{number_value: U32}\n  CommaToken{}\ntype LexingResult is Data:\n  LexingSuccess{list_of_tokens: List<&2, Token>}\n  LexingFailure{character_position: U32}\ntype PipelineResult is Data:\n  PipelineSuccess{result_value: U32}\n  PipelineFailure{error_stage: U32, error_ f_tokens, (current_token_index + 1 : U32), False{})\n    case CommaToken{} <> remaining_list_of_tokens False{}:\n      parse_list_of_tokens(remaining_list_of_tokens, (current_token_index + 1 : U32), True{})\n    case other_list_of_tokens other_is_expecting_number_token:\n      PipelineFailure{2, current_token_index}\n\ndef check_list_of_tokens(list_of_tokens: List<&2, Token>, +current_number_index: U32, +is_first_number: Bool, +previous_number_value: U32, +current_sum_value: U32) -> PipelineResult:\n  match list_of_tokens:\n    case Nil{}:\n      PipelineSuccess{current_sum_value}\n    case CommaToken{} <> remaining_list_of_tokens:\n      check_list_of_tokens(remaining_list_of_tokens, current_number_index, is_first_number, previous_number_value, current_sum_value)\n    case NumberToken{+number_value} <> remaining_list_of_tokens:\n      is_number_value_too_large = U32.is_gt(number_value, 1000)\n      is_number_value_not_increasing = Bool.and(Bool.not(is_first_number), U32.is_le(number_value, previous_number_value))\n      is_number_value_invalid = Bool.or(is_number_value_too_large, is_number_value_not_increasing)\n      next_checking_result = check_list_of_tokens(remaining_list_of_tokens, (current_number_index + 1 : U32), False{}, number_value, (current_sum_value + number_value : U32))\n      Bool.pick(PipelineResult, is_number_value_invalid, PipelineFailure{3, current_number_index}, next_checking_result)\n\ndef handle_parsing_result(parsing_result: PipelineResult, list_of_tokens: List<&2, Token>) -> PipelineResult:\n  match parsing_result:\n    case PipelineFailure{error_stage, error_position}:\n      PipelineFailure{error_stage, error_position}\n    case PipelineSuccess{result_value}:\n      check_list_of_tokens(list_of_tokens, 0, True{}, 0, 0)\n\ndef handle_lexing_result(lexing_result: LexingResult) -> PipelineResult:\n  match lexing_result:\n    case LexingFailure{character_position}:\n      PipelineFailure{1, character_position}\n    case LexingSuccess{+list_of_tokens}:\n      parsing_result = parse_list_of_tokens(list_of_tokens, 0, True{})\n      handle_parsing_result(parsing_result, list_of_tokens)\n\ndef run_pipeline(list_of_characters: List<&2, U32>) -> PipelineResult:\n  lexing_result = lex_list_of_characters(list_of_characters, 0, 0, False{}, Nil{})\n  pipeline_result = handle_lexing_result(lexing_result)\n  pipeline_result\n", "lines": 71}, "va5b222ef": {"code": "import Base\n\n# A verdict: Ok carries a running sum, Err a complaint (stage, place).\ntype Verdict is Data:\n  Ok{sum: U32}\n  Err{stage: U32, place: U32}\n\n# law: (Verdict, meet, Ok{0}) is a commutative monoid.\n#        Ok a  ⋄ Ok b  = Ok (a + b)       success adds\n#        Err e ⋄ Ok b  = Err e            failure absorbs\n#        Err e ⋄ Err f = Err (min e f)    the least complaint wins: stage, then place\n# \"The first error of the first failing stage\" is a minimum; it needs no control flow.\ndef meet(a: Verdict, b: Verdict) -> Verdict:\n  match a b:\n    case Ok{x}       Ok{y}:       Ok{(x + y : U32)}\n    case Ok{x}       e:           e\n    case e           Ok{y}:       e\n    case Err{+s, +p} Err{+t, +q}: Bool.pick(Verdict, (s < t : U32) || U32.is_eq(s, t) && (p < q : U32), Err{s, p}, Err{t, q})\n\n# A judgment either pays x or complains at (s, p).\ndef claim(ok: Bool, x: U32, s: U32, p: U32) -> Verdict:\n  Bool.pick(Verdict, ok, Ok{x}, Err{s, p})\n\n# law: digits fuse, so  number (comma number)*  holds iff no comma-separated field\n#      is empty; the first empty field j sits at token 2j. Strict increase is\n#      lo <= v  with lo := v + 1.\ndef field(+j: U32, lo: U32, +v: U32, ne: Bool) -> Verdict:\n  meet(claim(ne, 0, 2, (2 * j : U32)), claim((lo <= v : U32) && (v <= 1000 : U32), v, 3, j))\n\ntype Glyph is Data:\n  D{digit: U32}\n  C{}\n  X{}\n\ndef glyph(+c: U32) -> Glyph:\n  Bool.pick(Glyph, (c - 48 < 10 : U32), D{(c - 48 : U32)}, Bool.pick(Glyph, U32.is_eq(c, 44), C{}, X{}))\n\n# The state: place i, field j, floor lo, open value v, field non-empty ne.\ntype S is Data:\n  S{i: U32, j: U32, lo: U32, v: U32, ne: Bool}\n\n# A Mealy machine in two tables: what each glyph says, and where it leaves the state.\ndef say(g: Glyph, st: S) -> Verdict:\n  match g st:\n    case D{d} S{i, j, lo, v, ne}:  Ok{0}\n    case C{}  S{i, j, lo, v, ne}:  field(j, lo, v, ne)\n    case X{}  S{i, j, lo, v, ne}:  Err{1, i}\n\ndef eat(g: Glyph, st: S) -> S:\n  match g st:\n    case D{d} S{i, j, lo, v, ne}:  S{(i + 1 : U32), j, lo, (v * 10 + d : U32), True{}}\n    case C{}  S{i, j, lo, v, ne}:  S{(i + 1 : U32), (j + 1 : U32), (v + 1 : U32), 0, False{}}\n    case X{}  S{i, j, lo, v, ne}:  S{(i + 1 : U32), j, lo, v, ne}\n\n# law: walk(c <> cs, st) = say(g, st) ⋄ walk(cs, eat(g, st))  where g = glyph(c);\n#      and the end of input is a comma.\ndef walk(cs: List<&2, U32>, +st: S) -> Verdict:\n  match cs:\n    case Nil{}:     say(C{}, st)\n    case c <> rest:\n      +g = glyph(c)\n      meet(say(g, st), walk(rest, eat(g, st)))\n\ndef pipeline(cs: List<&2, U32>) -> Verdict:\n  walk(cs, S{0, 0, 0, 0, False{}})\n", "lines": 65}, "vb6a22e8f": {"code": "import Base\n\n# thread in, tally out.\n#   I.   comb    what is not bead nor knot, is burr.\n#   II.  weave   what is called, must answer.\n#   III. climb   what climbs, must not fall.\n# the first gate that snags, speaks. the others keep silent.\ntype Fiber is Data:\n  Bead{worth: U32}              # a bead is worth what it weighs\n  Knot{}                        # a knot is tied between beads\n  Burr{}                        # a burr is neither, and snags the comb\ntype Fate is Data:\n  Tally{worth: U32}             # the thread holds, and is counted\n  Snag{gate: U32, at: U32}      # the thread snags, and is named\ntype Turn is Data:\n  Call{}                        # the weaver calls for a bead\n  Reply{}                       # the thread replies with a knot, or with silence\n\n# what the hand feels, it names. what is named, is spun.\ndef feel(+c: U32) -> Fiber:\n  Bool.pick(Fibe const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) node.append(kid.nodeType ? kid : document.createTextNode(kid));

// ---- state and persistence --------------------------------------------------
const state = { docs: {}, step: 0 };
let db = null, writeBlocked = false;
const saveLabel = text => { $('#save').textContent = text; };
const queues = new Map();
function persist(id, body) {
  state.docs[id] = { ...(state.docs[id] || {}), ...body };
  try { localStorage.setItem('knot-taste-duel', JSON.stringify(state.docs)); } catch {}
  if (!db || writeBlocked) { saveLabel(db ? 'read-only' : 'local only'); return; }
  const q = queues.get(id) || { pending: null, running: false, timer: null };
  queues.set(id, q);
  q.pending = { ...state.docs[id], updatedAt: new Date().toISOString() };
  clearTimeout(q.timer);
  q.timer = setTimeout(() => flush(id), 350);
  saveLabel('saving…');
}
async function flush(id) {
  const q = queues.get(id);
  if (!q || q.running || !q.pending) return;
  q.running = true;
  const body = q.pending; q.pending = null;
  try { await db.doc('responses/' + id).set(body); saveLabel('saved'); }
  catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'not_granted')) { writeBlocked = true; saveLabel('read-only'); }
    else if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); q.pending ??= body; }
    else saveLabel('save failed');
  }
  q.running = false;
  if (q.pending) flush(id);

const KW = new Set(['def','match','case','import','as','type','is','law','for','if','else','return','with','bend','fold','when','open','let','use']);
function highlight(src) {
  const out = document.createDocumentFragment();
  const re = /(#[^\n]*)|("(?:[^"\\]|\\.)*")|(\b\d+[a-zA-Z_0-9]*\b)|([A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)|([\s\S])/g;
  let m;
  while ((m = re.exec(src))) {
    const [t, com, str, num, word] = m;
    let cls = null;
    if (com) cls = 'tok-com';
    else if (str) cls = 'tok-num';
    else if (num) cls = 'tok-num';
    else if (word) cls = KW.has(word) ? 'tok-kw' : /(^|\.)[A-Z]/.test(word) ? 'tok-ctor' : null;
    out.append(cls ? el('span', { class: cls }, t) : document.createTextNode(t));
  }
  return out;
}

  const base = { type: 'duel', task: du.task, left: du.left, right: du.right, repeat_of: du.repeat_of || null };
  const scale = el('div', { class: 'scale', role: 'group', 'aria-label': 'Which do you want more of?' },
    ...[[-2, '◀◀ strongly left'], [-1, '◀ left'], [0, 'no preference'], [1, 'right ▶'], [2, 'strongly right ▶▶']].map(([v, label]) =>
      el('button', { type: 'button', 'aria-pressed': String(d.score === v), onclick: () => { persist(id, { ...base, score: v }); render(); } }, label)));
  const chips = el('div', { class: 'chips', role: 'group', 'aria-label': 'Why' }, ...WHY.map(w => el('button', {
    type: 'button', class: 'chip', 'aria-pressed': String(!!d.why?.includes(w)),
    onclick: () => { const cur = new Set((state.docs[id] || {}).why || []); cur.has(w) ? cur.delete(w) : cur.add(w);
      persist(id, { ...base, why: [...cur] }); render(); } }, w)));
  main.append(el('div', { class: 'panel' }, el('div', { style: 'font-weight:700;margin-bottom:10px' }, 'Which one do you want more of in Knot?'),
    scale, chips, el('input', { class: 'note', id: `note-${id}`, type: 'text', maxlength: '300', placeholder: 'Anything else? (optional)',
      value: d.note || '', oninput: e => persist(id, { ...base, note: e.target.value }) })));
  main.append(nav(typeof d.score === 'number' ? 'saved' : 'pick a side, or “no preference”'));
}

function renderFinal(main) {
  const id = 'final', d = state.docs[id] || {};
  const field = (key, q, ph) => [el('label', { class: 'q', for: 'final-' + key }, q),
    el('textarea', { class: 'long', id: 'final-' + key, placeholder: ph, oninput: e => persist(id, { type: 'final', [key]: e.target.value }) }, d[key] || '')];
  const done = steps.filter(isDone).length;
  main.append(el('h2', {}, 'Last two questions'),
    ...field('want_more', 'In one sentence: what do you want Knot code to feel like?', 'e.g. “like the one where…”'),
    ...field('cringe', 'What made you wince, even in versions you liked?', 'optional'),
    el('p', { class: 'lede', style: 'margin-top:18px' }, `${done} of ${steps.length} sections complete.`));
  const reveal = el('div', { class: 'panel' });
  const btn = el('button', { type: 'button', class: 'reveal-btn', onclick: () => {
    btn.hidden = true;
    const rows = DATA.tasks.flatMap(t => t.order.map((vid, i) => {
      const r = state.docs['lineup-' + t.id] || {};
      return el('tr', {}, el('td', {}, t.title), el('td', {}, 'ABCDEF'[i]), el('td', {}, DATA.reveal[vid] || '?'),
        el('td', {}, r.reactions?.[vid] || '—'), el('td', {}, r.best === vid ? 'best' : r.worst === vid ? 'worst' : ''));
    }));
    reveal.append(el('div', { class: 'tablewrap' }, el('table', { class: 'reveal' },
      el('thead', {}, el('tr', {}, ...['Task', 'Card', 'Style', 'Your reaction', 'Pick'].map(h => el('th', {}, h)))),
      el('tbody', {}, rows))));
  } }, 'Reveal which style each card was');
  reveal.append(el('p', { class: 'lede', style: 'margin-top:0' }, 'Reveal only after you are done: your answers are already saved, and knowing the styles would bias any later round.'), btn);
  main.append(reveal, nav('thank you'));
}

function render() {
  const main = $('#main'); main.replaceChildren();
  const s = steps[state.step];
  if (s.key === 'intro') renderIntro(main);
  else if (s.task) renderLineup(main, s);
  else if (s.duel) renderDuel(main, s);
  else renderFinal(main);
  if (!db) main.append(el('p', { class: 'banner' }, 'Answers are being kept in this browser only until the page connects to its store.'));
  renderSteps();
  try { localStorage.setItem('knot-taste-duel-step', String(state.step)); } catch {}
}

// Boot: render immediately from any local draft, then light up the store.
try { Object.assign(state.docs, JSON.parse(localStorage.getItem('knot-taste-duel') || '{}')); } catch {}
try { state.step = Math.min(steps.length - 1, Number(localStorage.getItem('knot-taste-duel-step') || 0) || 0); } catch {}
render();
(async () => {
  db = window.claude?.use ? await window.claude.use('db') : null;
  if (!db) { saveLabel('local only'); render(); return; }
  try {
    const snap = await db.collection('responses').get();
    for (const doc of snap.docs) {
      const remote = doc.data();
      const local = state.docs[doc.id];
      if (!local || (remote.updatedAt || '') >= (local.updatedAt || '')) state.docs[doc.id] = remote;
    }
    // Push any answers made before the store connected.
    for (const [id, body] of Object.entries(state.docs)) {
      if (!snap.docs.some(doc => doc.id === id)) persist(id, body);
    }
    saveLabel('connected');
  } catch (e) { saveLabel('offline'); }
  render();
})();
</script>
